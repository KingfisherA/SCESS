<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Schrodinger's Cat's Electronic System Solver</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#114B4F"/><stop offset="0.55" stop-color="#0A2A35"/><stop offset="1" stop-color="#04121C"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="522" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CF2C4" stop-opacity="0.30"/><stop offset="1" stop-color="#5CF2C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="alive" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFE2A3"/><stop offset="0.5" stop-color="#FFB547"/><stop offset="1" stop-color="#E0761E"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DF5D2" stop-opacity="0.38"/><stop offset="1" stop-color="#7DF5D2" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="electron" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#B8FFEA"/><stop offset="1" stop-color="#3FD9AE"/>
    </radialGradient>
    <radialGradient id="eglow"><stop offset="0" stop-color="#7DF5D2" stop-opacity="0.6"/><stop offset="1" stop-color="#7DF5D2" stop-opacity="0"/></radialGradient>
    <clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="leftHalf"><rect x="0" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="rightHalf"><rect x="512" y="0" width="512" height="1024"/></clipPath>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="125%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="12" result="b"/><feOffset in="b" dy="8" result="o"/><feFlood flood-color="#01100D" flood-opacity="0.5" result="c"/><feComposite in="c" in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000" opacity="0.35" filter="url(#soft)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
