    <path d="M512,588 Q500,606 484,600" fill="none" stroke="#14363A" stroke-width="6" stroke-linecap="round"/>
    <path d="M512,588 Q524,606 540,600" fill="none" stroke="#9FFBE0" stroke-width="6" stroke-linecap="round"/>
